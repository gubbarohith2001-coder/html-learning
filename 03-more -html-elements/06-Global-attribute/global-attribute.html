<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global attribute</title>
  </head>
  <body>
    <a href="../index.html">HOME</a><br />
    <hr />
    <br />
    <h1>Global Attribute</h1>
    <br />

    <h2>class</h2>
    <h2 class="text-xl">Heading 1</h2>

    <h2>ID</h2>
    <h2 id="main-heading">heading 2</h2>

    <h2>style</h2>
    <p style="color: red; font-size: 20px">this is paragraph</p>

    <h2>accesskey and title</h2>
    <button
      title="Home Button"
      accesskey="h"
      onclick="alert('Home Button Clicked')"
    >
      HOME
    </button>

    <h2>Hidden</h2>

    <div hidden>this is a hidden div</div>

    <h2>tab index</h2>
    <button tabindex="3">Button 1</button>
    <button tabindex="1">Button 2</button>
    <button tabindex="2">Button 3</button>

    <h2>contenteditable</h2>
    <div contenteditable="true">this editable div Element</div>

    <h2>darggable</h2>
    <div draggable="true">this is draggable div</div>

    <h2>autofocus</h2>
    <input type="text" autofocus /> <br />
    <input type="text" />
  </body>
</html>
