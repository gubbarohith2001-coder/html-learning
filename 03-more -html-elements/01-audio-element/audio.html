<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>audio elememt</title>
  </head>
  <body>
    +
    <h1>Audio elememt</h1>

    <audio src="diamond.mp3" type="audio.mp3" controls></audio><br />

    <audio controls>
      <source src="diamond.mp3" type="audio" />
      <br />
      <!-- fallback -->
      <p>your browser does not support the audio element</p>
      <br />
    </audio>
    <!-- auto play -->

    <audio src="diamond.mp3" type="audio.mp3" controls autoplay></audio><br />

    <!-- loop -->
    <audio src="diamond.mp3" type="audio.mp3" controls loop></audio><br />

    <!-- fig and figcaption -->
    <figure>
      <figcaption>listen to the song</figcaption>
      <audio src="diamond.mp3" controls></audio>
      <a href="diamond.mp3">Download Audio</a>
    </figure>
  </body>
</html>
