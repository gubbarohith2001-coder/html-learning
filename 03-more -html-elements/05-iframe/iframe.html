<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframe</title>
  </head>
  <body>
    <a href="../index.html" target="_blank">HOME</a><br />
    <hr />
    <br />
    <h1>Iframe</h1>
    <br />

    <h2>web page</h2>
    <br />
    <iframe src="test.html" frameborder="0"></iframe><br />
    <h2>sandbox</h2>
     <iframe src="test.html" frameborder="0" sandbox></iframe><br />

    <h2>videos</h2>
    <br />
    <iframe
      src="https://youtube.com/embed/8sXRyHI3bLw"
      frameborder="0"
      width="500"
      height="350"
    ></iframe
    ><br />

    <h2>allow full screeen</h2>
    <iframe
      src="https://youtube.com/embed/8sXRyHI3bLw"
      frameborder="0"
      width="500"
      height="350"
      allowfullscreen
    ></iframe
    ><br />

    <h2>pdfs</h2>
    <br />
    <iframe
      src="invoicesample.pdf"
      frameborder="0"
      width="500"
      height="350"
    ></iframe
    ><br />

    <h2>google maps</h2>
    <br />
    <iframe
      height="350"
      width="500"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3152.0000000000005!2d-122.0841926846827!3d37.42240897982596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808f7e3f0b0b8a3d%3A0x7f3f7e3f0b0b8a3d!2sGoogleplex!5e0!3m2!1sen!2sus!4v1605720000000!5m2!1sen!2sus"
      frameborder="0"
    ></iframe
    ><br />

    <h2>google calender</h2>
    <br />
    <iframe
      src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=America%2FLos_Angeles"
      frameborder="0"
      width="500"
      height="350"
    ></iframe
    ><br />

    <h2>embed</h2>
    <br />
    <embed
      src="https://youtube.com/embed/8sXRyHI3bLw"
      width="500"
      height="350"
      type=""
    />
    <br />

    <h2>object</h2>
    <br />
    <object
      data="https://youtube.com/embed/8sXRyHI3bLw"
      width="500"
      height="350"
      type=""
    ></object>
    <br />
  </body>
</html>
