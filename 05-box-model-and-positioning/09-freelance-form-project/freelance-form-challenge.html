<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelance form project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a  href="../index.html">HOME</a>
    <main class="container">
      <div class="card">
        <h1>Need to hire a Freelancer?</h1>
        <p>sign up, type in what you need and recive free quotes in seconds</p>
        <form>
          <div class="form-group">
            <input
              type="text"
              id="text"
              name="text"
              placeholder="what you need done?"
            />
          </div>
          <div class="form-group">
            <button type="submit">Post a project</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
