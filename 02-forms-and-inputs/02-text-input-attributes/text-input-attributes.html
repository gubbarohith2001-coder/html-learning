<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>text input attributes</title>
  </head>
  <body>
    <a href="../index.html" target="_blank">HOME</a><br />
    <hr />
    <br />

    <h1>Text Input Attributes</h1>
    <form>
      <br />
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter name" name="name" />
      </div>
      <div>
        <br />
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter name"
          name="name"
          value="G rohith"
        />
      </div>
      <br />
      <div>
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter name"
          name="name"
          required
        />
      </div>
      <br />
      <div>
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter name"
          name="name"
          required
          minlength="3"
          maxlength="10"
        />
      </div>
      <br />
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter Email" name="email" />
      </div>
      <br />
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter Email"
          name="email"
          value="exmaple@gmail.com"
        />
      </div>
      <br />
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter Email"
          name="email"
          value="exmaple@gmail.com"
          required
          disabled
        />
      </div>
      <br />
      <div>
        <label for="Password">Password</label>
        <input
          type="Password"
          id="Password"
          placeholder="Enter Password"
          name="Password"
        />
      </div>
      <br />
      <div>
        <label for="Password">Password</label>
        <input
          type="Password"
          id="Password"
          placeholder="Enter Password"
          name="Password"
          required
          minlength="3"
          maxlength="10"
        />
      </div>
      <br />
      <div>
        <input type="submit" value="submit" />
        <br />
        <br />
        <button type="submit">submit</button>
      </div>
    </form>
  </body>
</html>
