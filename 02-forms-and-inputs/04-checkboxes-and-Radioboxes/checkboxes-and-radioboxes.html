<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CheckBoxes and Radio Boxes</title>
  </head>
  <body>
    <a href="../index.html" target="_blank">CheckBoxes and Radio Boxes</a><br />
    <hr />
    <br />
    <h1>CheckBoxes and Radio Boxes</h1>
    <br />

    <h2>Favorite programming Language</h2>
    <form>
      <label for="html">
        <input type="checkbox" name="languages" id="html" value="html" />
        HTML
      </label>
      <label for="html">
        <input
          type="checkbox"
          name="languages"
          id="html"
          value="html"
          disabled
        />
        HTML
      </label>
      <label for="CSS">
        <input type="checkbox" name="languages" id="CSS" value="CSS" />
        CSS
      </label>
      <label for="CSS">
        <input type="checkbox" name="languages" id="CSS" value="CSS" checked />
        CSS
      </label>
      <label for="JavaScript">
        <input
          type="checkbox"
          name="languages"
          id="JavaScript"
          value="JavaScript"
        />
        JavaScript
      </label>
    </form>
    <br /><br />

    <h2>Product size</h2>
    <br />

    <form>
      <label for="small">
        <input type="radio" name="size" id="small" value="small" />Small
      </label>
      <label for="medium">
        <input type="radio" name="size" id="medium" value="medium" />Medium
      </label>
      <label for="large">
        <input type="radio" name="size" id="large" value="large" />Large
      </label>
      <label for="X-Large">
        <input
          type="radio"
          name="size"
          id="X-Large"
          value="X-Large"
          checked
        />X-Large
      </label>
    </form>
  </body>
</html>
